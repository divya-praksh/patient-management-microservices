server:
  port: ${PORT:8082}

spring:
  application:
    name: appointment-service
  datasource:
    url: ${DB_URL:jdbc:h2:mem:appointments;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all

clients:
  patient-service:
    url: ${PATIENT_SERVICE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
