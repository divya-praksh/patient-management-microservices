name: hospital-pms

x-service-env: &service-env
  DB_USER: hospital
  DB_PASSWORD: hospital
  KAFKA_BOOTSTRAP: kafka:9092

x-service-deps: &service-deps
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: hospital
      POSTGRES_DB: hospital
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports:
      - "9094:9094"   # for tools on your machine: localhost:9094
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 12

  patient-service:
    build: { context: ., args: { MODULE: patient-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/patients
    ports: ["8081:8081"]
    depends_on: *service-deps

  appointment-service:
    build: { context: ., args: { MODULE: appointment-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/appointments
      PATIENT_SERVICE_URL: http://patient-service:8081
    ports: ["8082:8082"]
    depends_on: *service-deps

  billing-service:
    build: { context: ., args: { MODULE: billing-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/billing
    ports: ["8083:8083"]
    depends_on: *service-deps

  notification-service:
    build: { context: ., args: { MODULE: notification-service } }
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://postgres:5432/notifications
    ports: ["8084:8084"]
    depends_on: *service-deps

  api-gateway:
    build: { context: ., args: { MODULE: api-gateway } }
    environment:
      PATIENT_SERVICE_URL: http://patient-service:8081
      APPOINTMENT_SERVICE_URL: http://appointment-service:8082
      BILLING_SERVICE_URL: http://billing-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    ports: ["8080:8080"]
    depends_on:
      - patient-service
      - appointment-service
      - billing-service
      - notification-service
